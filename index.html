<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoftAccess – Login</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0d14;font-family:'Sora','Segoe UI',sans-serif;color:#e8eaf0}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#0a0d14}
    ::-webkit-scrollbar-thumb{background:#1e2435;border-radius:4px}
    button,input,select,textarea{font-family:inherit}
    /* Login page */
    .login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0d14;position:relative;overflow:hidden}
    .login-bg::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(79,142,247,.12) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none}
    .login-bg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.1) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
    .login-card{background:#111827;border:1.5px solid #1e2d40;border-radius:20px;padding:44px 48px;width:100%;max-width:440px;position:relative;box-shadow:0 32px 80px rgba(0,0,0,.6)}
    .login-input{width:100%;background:#0a0d14;border:1.5px solid #1e2435;color:#e8eaf0;border-radius:10px;padding:13px 16px;font-size:15px;outline:none;transition:border .2s,box-shadow .2s;margin-bottom:14px}
    .login-input:focus{border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.15)}
    .login-input::placeholder{color:#3d4a6e}
    .login-btn{width:100%;background:linear-gradient(135deg,#4f8ef7,#7c3aed);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.3px}
    .login-btn:hover{opacity:.9}
    .login-btn:active{transform:scale(.98)}
    .login-btn:disabled{opacity:.5;cursor:not-allowed}
    .role-chip{display:inline-flex;align-items:center;gap:6px;background:#0a0d14;border:1.5px solid #1e2435;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;color:#7b82a0}
    .role-chip.active{border-color:#4f8ef7;color:#4f8ef7;background:#0d1829}
    .role-chip:hover{border-color:#4f8ef7;color:#4f8ef7}
    .err-box{background:#2d1010;border:1px solid #f87171;border-radius:8px;padding:10px 14px;color:#f87171;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    /* Dashboard */
    .del-btn{background:#2d1010;color:#f87171;border:1px solid #f87171;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}
    .del-btn:hover{background:#f87171;color:#fff}
    .add-btn{background:#0d2d22;color:#34d399;border:1px solid #34d399;border-radius:7px;padding:7px 18px;cursor:pointer;font-size:13px;font-weight:700;margin-top:10px}
    .add-btn:hover{background:#34d399;color:#fff}
    .save-btn{background:#4f8ef7;color:#fff;border:none;border-radius:8px;padding:9px 24px;cursor:pointer;font-size:14px;font-weight:800}
    .save-btn:hover{background:#3a7ef0}
    .edit-section{background:#111827;border:1.5px solid #1e2d40;border-radius:12px;padding:20px 24px;margin-bottom:18px}
    .edit-section h3{color:#4f8ef7;font-size:15px;font-weight:800;margin-bottom:14px}
    .edit-row{display:grid;gap:8px;margin-bottom:10px;align-items:center}
    .edit-row.emp{grid-template-columns:80px 1fr 1fr 1fr 1fr 1fr auto}
    .edit-row.mgr{grid-template-columns:1fr 1fr 1fr auto}
    .edit-row.rev{grid-template-columns:70px 1fr 1fr 1fr 100px auto}
    .col-label{color:#3d4a6e;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    input.fi,select.fi{background:#0a0d14;color:#e8eaf0;border:1.5px solid #1e2435;border-radius:7px;padding:7px 12px;font-size:13px;width:100%;outline:none;transition:border .2s}
    input.fi:focus,select.fi:focus{border-color:#4f8ef7}
    .toast{position:fixed;bottom:28px;right:28px;background:#111827;border:1.5px solid #34d399;color:#34d399;border-radius:10px;padding:12px 24px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideIn .3s ease}
    .toast.err{border-color:#f87171;color:#f87171}
    @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .fade-in{animation:fadeIn .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .qcard{background:#0d1829;border:1.5px solid #1e2d40;border-radius:10px;padding:16px;cursor:pointer;transition:border .2s;text-align:left}
    .qcard:hover{border-color:#4f8ef7}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ─── THEME ─── */
const C={bg:"#0a0d14",card:"#111827",border:"#1e2d40",accent:"#4f8ef7",accent2:"#34d399",accent3:"#f59e42",danger:"#f87171",text:"#e8eaf0",muted:"#7b82a0",highlight:"#0d1829",purple:"#7c3aed"};

/* ─── USER ACCOUNTS ─── */
const USERS = [
  /* ADMIN */
  { id:"U001", username:"admin",        password:"admin123",   name:"Admin User",     role:"admin",    department:"IT",          avatar:"A" },
  /* MANAGERS */
  { id:"U002", username:"priya",        password:"priya123",   name:"Priya Sharma",   role:"manager",  department:"Engineering",  avatar:"P" },
  { id:"U003", username:"vikram",       password:"vikram123",  name:"Vikram Nair",    role:"manager",  department:"HR",           avatar:"V" },
  { id:"U004", username:"anjali",       password:"anjali123",  name:"Anjali Iyer",    role:"manager",  department:"Finance",      avatar:"A" },
  /* EMPLOYEES */
  { id:"U005", username:"arjun",        password:"arjun123",   name:"Arjun Reddy",    role:"employee", department:"Engineering",  avatar:"A" },
  { id:"U006", username:"sneha",        password:"sneha123",   name:"Sneha Kapoor",   role:"employee", department:"Engineering",  avatar:"S" },
  { id:"U007", username:"rahul",        password:"rahul123",   name:"Rahul Mehta",    role:"employee", department:"HR",           avatar:"R" },
  { id:"U008", username:"divya",        password:"divya123",   name:"Divya Singh",    role:"employee", department:"HR",           avatar:"D" },
  { id:"U009", username:"kiran",        password:"kiran123",   name:"Kiran Babu",     role:"employee", department:"Finance",      avatar:"K" },
  { id:"U010", username:"meera",        password:"meera123",   name:"Meera Nair",     role:"employee", department:"Finance",      avatar:"M" },
];

/* ─── DEFAULT DATA ─── */
const DEFAULT={
  employees:[
    {id:"E001",name:"Arjun Reddy",  email:"arjun@company.com", manager:"Priya Sharma",department:"Engineering",software:["Jira","GitHub","Slack","Figma"]},
    {id:"E002",name:"Sneha Kapoor", email:"sneha@company.com", manager:"Priya Sharma",department:"Engineering",software:["Jira","GitHub","Slack"]},
    {id:"E003",name:"Rahul Mehta",  email:"rahul@company.com", manager:"Vikram Nair", department:"HR",         software:["Keka","Slack","Zoom"]},
    {id:"E004",name:"Divya Singh",  email:"divya@company.com", manager:"Vikram Nair", department:"HR",         software:["Keka","Slack"]},
    {id:"E005",name:"Kiran Babu",   email:"kiran@company.com", manager:"Anjali Iyer", department:"Finance",    software:["SAP","Slack","Zoom","Tableau"]},
    {id:"E006",name:"Meera Nair",   email:"meera@company.com", manager:"Anjali Iyer", department:"Finance",    software:["SAP","Slack"]},
  ],
  managers:[
    {name:"Priya Sharma",email:"priya@company.com",department:"Engineering"},
    {name:"Vikram Nair", email:"vikram@company.com",department:"HR"},
    {name:"Anjali Iyer", email:"anjali@company.com",department:"Finance"},
  ],
  softwareList:["Jira","GitHub","Slack","Figma","Keka","Zoom","SAP","Tableau","Notion","Confluence"],
  reviews:[
    {id:"R001",employee:"Arjun Reddy", software:"Figma",  manager:"Priya Sharma",status:"Pending", quarter:"Q2 2026"},
    {id:"R002",employee:"Kiran Babu",  software:"Tableau",manager:"Anjali Iyer", status:"Approved",quarter:"Q2 2026"},
    {id:"R003",employee:"Sneha Kapoor",software:"GitHub", manager:"Priya Sharma",status:"Revoked", quarter:"Q2 2026"},
    {id:"R004",employee:"Divya Singh", software:"Keka",   manager:"Vikram Nair", status:"Pending", quarter:"Q2 2026"},
  ],
};

/* ─── UTILS ─── */
function dl(content,name,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();}
function toCSV(rows,cols){const e=v=>`"${String(v===undefined||v===null?"":v).replace(/"/g,'""')}"`;return[cols.join(","),...rows.map(r=>cols.map(c=>e(Array.isArray(r[c])?r[c].join("|"):r[c])).join(","))].join("\n");}

const sBg={Pending:"#2d2210",Approved:"#0d2d22",Revoked:"#2d1010"};
const sC={Pending:C.accent3,Approved:C.accent2,Revoked:C.danger};
function Badge({status}){return <span style={{background:sBg[status]||C.highlight,color:sC[status]||C.muted,borderRadius:6,padding:"2px 12px",fontSize:12,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{status}</span>}
function StatCard({label,value,sub,color}){return <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"22px 28px",flex:1,minWidth:140}}><div style={{fontSize:30,fontWeight:800,color:color||C.accent,fontFamily:"'DM Mono',monospace"}}>{value}</div><div style={{fontSize:14,color:C.text,fontWeight:600,marginTop:4}}>{label}</div>{sub&&<div style={{fontSize:12,color:C.muted,marginTop:2}}>{sub}</div>}</div>}

/* ─── AVATAR ─── */
function Avatar({user,size=36}){
  const roleColor={admin:C.danger,manager:C.accent3,employee:C.accent2};
  return <div style={{width:size,height:size,borderRadius:"50%",background:`linear-gradient(135deg,${roleColor[user.role]||C.accent},${C.purple})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:size*0.4,color:"#fff",flexShrink:0}}>{user.avatar}</div>;
}

/* ─── ROLE BADGE ─── */
function RoleBadge({role}){
  const map={admin:{label:"Admin",bg:"#2d1010",color:C.danger},manager:{label:"Manager",bg:"#2d2210",color:C.accent3},employee:{label:"Employee",bg:"#0d2d22",color:C.accent2}};
  const s=map[role]||{label:role,bg:C.highlight,color:C.muted};
  return <span style={{background:s.bg,color:s.color,borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{s.label}</span>;
}

/* ════════════════════════════════
   LOGIN PAGE
════════════════════════════════ */
function LoginPage({onLogin}){
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const [demoRole,setDemoRole]=useState(null);

  const DEMO={
    admin:{username:"admin",password:"admin123"},
    manager:{username:"priya",password:"priya123"},
    employee:{username:"arjun",password:"arjun123"},
  };

  function fillDemo(role){
    setDemoRole(role);
    setUsername(DEMO[role].username);
    setPassword(DEMO[role].password);
    setError("");
  }

  function handleLogin(){
    setError("");
    if(!username.trim()||!password.trim()){setError("Please enter username and password.");return;}
    setLoading(true);
    setTimeout(()=>{
      const user=USERS.find(u=>u.username===username.trim().toLowerCase()&&u.password===password);
      if(user){onLogin(user);}
      else{setError("Invalid username or password.");setLoading(false);}
    },700);
  }

  return(
    <div className="login-bg">
      <div className="login-card fade-in">
        {/* Logo */}
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:32}}>
          <div style={{width:44,height:44,borderRadius:12,background:`linear-gradient(135deg,${C.accent},${C.purple})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:22,color:"#fff",boxShadow:`0 4px 20px rgba(79,142,247,.3)`}}>S</div>
          <div>
            <div style={{fontWeight:800,fontSize:20,letterSpacing:-0.5}}>SoftAccess</div>
            <div style={{fontSize:11,color:C.muted,letterSpacing:1.5}}>ACCESS REVIEW PLATFORM</div>
          </div>
        </div>

        <div style={{fontWeight:800,fontSize:22,marginBottom:4}}>Welcome back 👋</div>
        <div style={{color:C.muted,fontSize:14,marginBottom:28}}>Sign in to your account to continue</div>

        {/* Quick login chips */}
        <div style={{marginBottom:20}}>
          <div style={{color:C.muted,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Quick Demo Login</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {[{role:"admin",label:"🛡 Admin"},{role:"manager",label:"🧑‍💼 Manager"},{role:"employee",label:"👤 Employee"}].map(d=>(
              <button key={d.role} className={`role-chip${demoRole===d.role?" active":""}`} onClick={()=>fillDemo(d.role)}>{d.label}</button>
            ))}
          </div>
        </div>

        {/* Divider */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <div style={{flex:1,height:1,background:C.border}}/>
          <span style={{color:C.muted,fontSize:12}}>or enter credentials</span>
          <div style={{flex:1,height:1,background:C.border}}/>
        </div>

        {error&&<div className="err-box">⚠️ {error}</div>}

        <div style={{position:"relative",marginBottom:0}}>
          <input className="login-input" value={username} onChange={e=>{setUsername(e.target.value);setError("");}} placeholder="Username" onKeyDown={e=>e.key==="Enter"&&handleLogin()} autoComplete="username"/>
        </div>
        <div style={{position:"relative"}}>
          <input className="login-input" type={showPw?"text":"password"} value={password} onChange={e=>{setPassword(e.target.value);setError("");}} placeholder="Password" onKeyDown={e=>e.key==="Enter"&&handleLogin()} autoComplete="current-password"/>
          <button onClick={()=>setShowPw(!showPw)} style={{position:"absolute",right:12,top:13,background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>{showPw?"🙈":"👁"}</button>
        </div>

        <button className="login-btn" onClick={handleLogin} disabled={loading}>
          {loading?"Signing in...":"Sign In →"}
        </button>

        {/* Role info table */}
        <div style={{marginTop:28,background:C.highlight,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px"}}>
          <div style={{color:C.muted,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>All Demo Accounts</div>
          {[
            {role:"admin",   users:[{u:"admin",  p:"admin123"}]},
            {role:"manager", users:[{u:"priya",  p:"priya123"},{u:"vikram",p:"vikram123"},{u:"anjali",p:"anjali123"}]},
            {role:"employee",users:[{u:"arjun",  p:"arjun123"},{u:"sneha", p:"sneha123"},{u:"rahul",p:"rahul123"}]},
          ].map(g=>(
            <div key={g.role} style={{marginBottom:8}}>
              <RoleBadge role={g.role}/>
              <div style={{marginTop:5,display:"flex",flexWrap:"wrap",gap:6}}>
                {g.users.map(u=>(
                  <button key={u.u} onClick={()=>{setUsername(u.u);setPassword(u.p);setDemoRole(g.role);setError("");}} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:"3px 10px",cursor:"pointer",fontSize:12,color:C.text,fontWeight:600}}>
                    {u.u} / {u.p}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════
   EDIT MODAL (Admin only)
════════════════════════════════ */
function EditModal({data,onSave,onClose}){
  const [d,setD]=useState(JSON.parse(JSON.stringify(data)));
  const ue=(i,f,v)=>setD(p=>{const e=[...p.employees];e[i]={...e[i],[f]:v};return{...p,employees:e}});
  const uesw=(i,v)=>setD(p=>{const e=[...p.employees];e[i]={...e[i],software:v.split(",").map(s=>s.trim()).filter(Boolean)};return{...p,employees:e}});
  const de=i=>setD(p=>({...p,employees:p.employees.filter((_,j)=>j!==i)}));
  const ae=()=>setD(p=>({...p,employees:[...p.employees,{id:"E"+(p.employees.length+1).toString().padStart(3,"0"),name:"",email:"",manager:p.managers[0]?.name||"",department:"",software:[]}]}));
  const um=(i,f,v)=>setD(p=>{const m=[...p.managers];m[i]={...m[i],[f]:v};return{...p,managers:m}});
  const dm=i=>setD(p=>({...p,managers:p.managers.filter((_,j)=>j!==i)}));
  const am=()=>setD(p=>({...p,managers:[...p.managers,{name:"",email:"",department:""}]}));
  const us=(i,v)=>setD(p=>{const s=[...p.softwareList];s[i]=v;return{...p,softwareList:s}});
  const ds=i=>setD(p=>({...p,softwareList:p.softwareList.filter((_,j)=>j!==i)}));
  const as=()=>setD(p=>({...p,softwareList:[...p.softwareList,""]}));
  const ur=(i,f,v)=>setD(p=>{const r=[...p.reviews];r[i]={...r[i],[f]:v};return{...p,reviews:r}});
  const dr=i=>setD(p=>({...p,reviews:p.reviews.filter((_,j)=>j!==i)}));
  const ar=()=>setD(p=>({...p,reviews:[...p.reviews,{id:"R"+(p.reviews.length+1).toString().padStart(3,"0"),employee:"",software:"",manager:p.managers[0]?.name||"",status:"Pending",quarter:"Q2 2026"}]}));
  const inp=(val,fn,ph="")=><input className="fi" value={val} onChange={e=>fn(e.target.value)} placeholder={ph}/>;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:16,width:"95%",maxWidth:1000,maxHeight:"92vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,.7)"}}>
        <div style={{background:C.card,borderBottom:`1.5px solid ${C.border}`,padding:"18px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:18}}>✏️ Edit Dashboard Data</div>
          <div style={{display:"flex",gap:10}}>
            <button className="save-btn" onClick={()=>onSave(d)}>💾 Save</button>
            <button onClick={onClose} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"9px 16px",cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
        <div style={{overflowY:"auto",padding:"24px 28px",flex:1}}>
          <div className="edit-section">
            <h3>👥 Employees</h3>
            <div className="edit-row emp" style={{marginBottom:6}}>{["ID","Name","Email","Manager","Dept","Software (comma sep)",""].map((l,i)=><div key={i} className="col-label">{l}</div>)}</div>
            {d.employees.map((e,i)=><div key={i} className="edit-row emp">
              {inp(e.id,v=>ue(i,"id",v))}{inp(e.name,v=>ue(i,"name",v),"Full Name")}{inp(e.email,v=>ue(i,"email",v),"email@co.com")}
              <select className="fi" value={e.manager} onChange={ev=>ue(i,"manager",ev.target.value)}>{d.managers.map(m=><option key={m.name}>{m.name}</option>)}</select>
              {inp(e.department,v=>ue(i,"department",v),"Dept")}{inp(e.software.join(", "),v=>uesw(i,v),"Jira, Slack...")}
              <button className="del-btn" onClick={()=>de(i)}>✕</button>
            </div>)}
            <button className="add-btn" onClick={ae}>+ Add Employee</button>
          </div>
          <div className="edit-section">
            <h3>🧑‍💼 Managers</h3>
            <div className="edit-row mgr" style={{marginBottom:6}}>{["Name","Email","Department",""].map((l,i)=><div key={i} className="col-label">{l}</div>)}</div>
            {d.managers.map((m,i)=><div key={i} className="edit-row mgr">
              {inp(m.name,v=>um(i,"name",v))}{inp(m.email,v=>um(i,"email",v))}{inp(m.department,v=>um(i,"department",v))}
              <button className="del-btn" onClick={()=>dm(i)}>✕</button>
            </div>)}
            <button className="add-btn" onClick={am}>+ Add Manager</button>
          </div>
          <div className="edit-section">
            <h3>📦 Software List</h3>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {d.softwareList.map((sw,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,background:C.highlight,border:`1px solid ${C.border}`,borderRadius:8,padding:"4px 4px 4px 10px"}}>
                <input className="fi" value={sw} onChange={e=>us(i,e.target.value)} style={{width:100,background:"transparent",border:"none",fontWeight:700,fontSize:13}}/>
                <button className="del-btn" style={{margin:0}} onClick={()=>ds(i)}>✕</button>
              </div>)}
              <button className="add-btn" style={{margin:0}} onClick={as}>+ Add</button>
            </div>
          </div>
          <div className="edit-section">
            <h3>📋 Reviews</h3>

/* ════════════════════════════════

════════════════════════════════ */
function IOModal({data,onImport,onClose}){
  const [tab,setTab]=useState("export");
  const [importText,setImportText]=useState("");
  const [importType,setImportType]=useState("employees");
  const [importFmt,setImportFmt]=useState("csv");
  const [exportTarget,setExportTarget]=useState("employees");
  const [exportFmt,setExportFmt]=useState("csv");
  const fileRef=useRef();
  const COLS={employees:["id","name","email","manager","department","software"],managers:["name","email","department"],reviews:["id","employee","software","manager","status","quarter"],softwareList:["name"]};

  function doExport(){
    if(exportFmt==="full"){dl(JSON.stringify(data,null,2),"softaccess_backup.json","application/json");return;}
    const rows=exportTarget==="softwareList"?data.softwareList.map(s=>({name:s})):data[exportTarget];
    if(exportFmt==="csv")dl(toCSV(rows,COLS[exportTarget]),`${exportTarget}.csv`,"text/csv");
    else dl(JSON.stringify(rows,null,2),`${exportTarget}.json`,"application/json");
  }

  function parseCSV(text){
    const lines=text.trim().split(/\r?\n/);
    const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
    return lines.slice(1).filter(l=>l.trim()).map(line=>{
      const vals=[];let cur="",inQ=false;
      for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===","&&!inQ){vals.push(cur);cur="";}else cur+=ch;}
      vals.push(cur);
      const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||"").replace(/^"|"$/g,"").trim());
      return obj;
    });
  }

  function doImport(){
    try{
      let parsed;const text=importText.trim();
      if(importFmt==="json"){parsed=JSON.parse(text);if(parsed.employees&&parsed.managers&&parsed.reviews){onImport(parsed);return;}}
      else{parsed=parseCSV(text);}
      const next={...data};
      if(importType==="softwareList")next.softwareList=parsed.map(r=>r.name).filter(Boolean);
      else if(importType==="employees")next.employees=parsed.map(r=>({...r,software:r.software?r.software.split("|").map(s=>s.trim()):[]}));
      else next[importType]=parsed;
      onImport(next);
    }catch(e){alert("❌ Error: "+e.message);}
  }

  function handleFile(e){const f=e.target.files[0];if(!f)return;setImportFmt(f.name.endsWith(".json")?"json":"csv");const r=new FileReader();r.onload=ev=>setImportText(ev.target.result);r.readAsText(f);}
  const tb=(t,lbl)=><button onClick={()=>setTab(t)} style={{background:tab===t?C.accent:C.highlight,color:tab===t?"#fff":C.muted,border:`1px solid ${tab===t?C.accent:C.border}`,borderRadius:8,padding:"8px 22px",cursor:"pointer",fontWeight:700,fontSize:14}}>{lbl}</button>;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:16,width:"95%",maxWidth:700,maxHeight:"92vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,.7)"}}>
        <div style={{background:C.bg,borderBottom:`1.5px solid ${C.border}`,padding:"18px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:18}}>📂 Import / Export Data</div>
          <button onClick={onClose} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13}}>✕ Close</button>
        </div>
        <div style={{display:"flex",gap:10,padding:"14px 28px",borderBottom:`1px solid ${C.border}`,background:C.card}}>
          {tb("export","📤 Export")}{tb("import","📥 Import")}
        </div>
        <div style={{overflowY:"auto",padding:"24px 28px",flex:1}}>
          {tab==="export"&&(
            <div>
              <p style={{color:C.muted,fontSize:14,marginBottom:20}}>Download data as CSV (Excel/Sheets) or JSON backup.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:24}}>
                {[
                  {label:"👥 Employees CSV",color:C.accent,  fn:()=>dl(toCSV(data.employees,COLS.employees),"employees.csv","text/csv")},
                  {label:"🧑‍💼 Managers CSV", color:"#a78bfa",fn:()=>dl(toCSV(data.managers,COLS.managers),"managers.csv","text/csv")},
                  {label:"📋 Reviews CSV",   color:C.accent3, fn:()=>dl(toCSV(data.reviews,COLS.reviews),"reviews.csv","text/csv")},
                  {label:"🗂 Full Backup",   color:C.accent2, fn:()=>dl(JSON.stringify(data,null,2),"softaccess_backup.json","application/json")},
                ].map((q,i)=><button key={i} className="qcard" onClick={q.fn} style={{border:`1.5px solid ${q.color}`}}>
                  <div style={{fontWeight:700,color:q.color,fontSize:14}}>{q.label}</div>
                  <div style={{color:C.muted,fontSize:12,marginTop:4}}>⬇️ Click to download</div>
                </button>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                <div><div style={{color:C.muted,fontSize:12,marginBottom:6}}>What to export</div>
                  <select className="fi" value={exportTarget} onChange={e=>setExportTarget(e.target.value)}>
                    <option value="employees">Employees</option><option value="managers">Managers</option>
                    <option value="reviews">Reviews</option><option value="softwareList">Software</option>
                  </select></div>
                <div><div style={{color:C.muted,fontSize:12,marginBottom:6}}>Format</div>
                  <select className="fi" value={exportFmt} onChange={e=>setExportFmt(e.target.value)}>
                    <option value="csv">CSV</option><option value="json">JSON</option><option value="full">Full Backup</option>
                  </select></div>
              </div>
              <button className="save-btn" style={{width:"100%",padding:"12px"}} onClick={doExport}>⬇️ Download</button>
            </div>
          )}
          {tab==="import"&&(
            <div>
              <p style={{color:C.muted,fontSize:14,marginBottom:16}}>Upload CSV or JSON to load data into the dashboard.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                <div><div style={{color:C.muted,fontSize:12,marginBottom:6}}>Import into</div>
                  <select className="fi" value={importType} onChange={e=>setImportType(e.target.value)}>
                    <option value="employees">Employees</option><option value="managers">Managers</option>
                    <option value="reviews">Reviews</option><option value="softwareList">Software</option>
                  </select></div>
                <div><div style={{color:C.muted,fontSize:12,marginBottom:6}}>Format</div>
                  <select className="fi" value={importFmt} onChange={e=>setImportFmt(e.target.value)}>
                    <option value="csv">CSV</option><option value="json">JSON</option>
                  </select></div>
              </div>
              <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${C.accent}`,borderRadius:12,padding:"22px",textAlign:"center",cursor:"pointer",background:C.highlight,marginBottom:14}}>
                <div style={{fontSize:32,marginBottom:6}}>📁</div>
                <div style={{fontWeight:700,fontSize:14}}>Click to upload .csv or .json</div>
                <input ref={fileRef} type="file" accept=".csv,.json" onChange={handleFile} style={{display:"none"}}/>
              </div>
              <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder="Or paste CSV/JSON here..."
                style={{width:"100%",minHeight:120,background:C.bg,color:C.text,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"12px",fontSize:13,fontFamily:"'DM Mono',monospace",resize:"vertical",outline:"none",marginBottom:14}}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <button className="save-btn" style={{padding:"12px"}} onClick={doImport} disabled={!importText.trim()}>📥 Import & Apply</button>
                <button onClick={()=>{setImportText("");if(fileRef.current)fileRef.current.value="";}} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"12px",cursor:"pointer",fontWeight:700,fontSize:14}}>🗑 Clear</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

              <div>
                <div style={{fontSize:20,fontWeight:800}}>{isManager?"My Team's Reviews":"All Access Reviews"}</div>
                <div style={{color:C.muted,fontSize:13,marginTop:2}}>{isManager?"You can approve or revoke access for your team":"Full admin control over all reviews"}</div>
              </div>
              {isAdmin&&<button onClick={()=>{dl(toCSV(reviews,["id","employee","software","manager","status","quarter"]),"reviews.csv","text/csv");showToast("✅ Downloaded!");}} style={{background:C.highlight,border:`1px solid ${C.accent2}`,color:C.accent2,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontWeight:700,fontSize:13}}>⬇️ Export CSV</button>}
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:C.highlight}}>{["Review ID","Employee","Software","Manager","Quarter","Status","Action"].map(h=><th key={h} style={{padding:"11px 14px",textAlign:"left",color:C.muted,fontWeight:700,borderBottom:`1.5px solid ${C.border}`}}>{h}</th>)}</tr></thead>
                <tbody>{myReviews.map((r,i)=>(
                  <tr key={r.id} style={{background:i%2===0?C.card:C.bg}}>
                    <td style={{padding:"11px 14px",color:C.muted,fontFamily:"monospace"}}>{r.id}</td>
                    <td style={{padding:"11px 14px",fontWeight:600}}>{r.employee}</td>
                    <td style={{padding:"11px 14px"}}><span style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:5,padding:"1px 8px",fontSize:11,fontWeight:600}}>{r.software}</span></td>
                    <td style={{padding:"11px 14px",color:C.accent}}>{r.manager}</td>
                    <td style={{padding:"11px 14px",color:C.muted}}>{r.quarter}</td>
                    <td style={{padding:"11px 14px"}}><Badge status={r.status}/></td>
                    <td style={{padding:"11px 14px"}}>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>changeStatus(r.id,"Approved")} style={{background:r.status==="Approved"?C.accent2:"transparent",color:r.status==="Approved"?"#fff":C.accent2,border:`1px solid ${C.accent2}`,borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>✓ Approve</button>
                        <button onClick={()=>changeStatus(r.id,"Revoked")} style={{background:r.status==="Revoked"?C.danger:"transparent",color:r.status==="Revoked"?"#fff":C.danger,border:`1px solid ${C.danger}`,borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>✗ Revoke</button>
                      </div>
                    </td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        )}

        {/* ════ EMAIL PREVIEW ════ */}
        {tab==="Email Preview"&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>Quarterly Email Preview</div>
            <div style={{color:C.muted,fontSize:13,marginBottom:20}}>Preview the quarterly email sent to each manager.</div>
            {isAdmin&&<div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
              {data.managers.map(m=><button key={m.name} onClick={()=>setSelMgr(m.name)} style={{background:selMgr===m.name?C.accent:C.highlight,color:selMgr===m.name?"#fff":C.text,border:`1px solid ${selMgr===m.name?C.accent:C.border}`,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontWeight:600,fontSize:13}}>{m.name}</button>)}
            </div>}
            {(() => {
              const mgr=isManager?user.name:selMgr;
              const emps=data.employees.filter(e=>e.manager===mgr);
              return(
                <div style={{background:"#fff",borderRadius:14,overflow:"hidden",maxWidth:660,boxShadow:"0 8px 40px rgba(0,0,0,.4)"}}>
                  <div style={{background:"#1a73e8",padding:"16px 24px",color:"#fff"}}>
                    <div style={{fontWeight:800,fontSize:17}}>🔐 Quarterly Software Access Review – Action Required</div>
                    <div style={{fontSize:12,marginTop:4,opacity:.85}}>Q2 2026 · {new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</div>
                  </div>
                  <div style={{padding:"24px 28px",color:"#222",fontFamily:"sans-serif",fontSize:14,lineHeight:1.7}}>
                    <p>Dear <strong>{mgr}</strong>,</p>
                    <p style={{marginTop:10}}>Please review your team's software access below.</p>
                    <p style={{fontWeight:700,margin:"14px 0 8px"}}>Your Team's Software Access:</p>
                    <table style={{width:"100%",borderCollapse:"collapse",marginBottom:18,fontSize:13}}>
                      <thead><tr style={{background:"#f3f6fb"}}>{["Employee","Software","Still Required?"].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#555",fontWeight:700,borderBottom:"2px solid #e0e7ef"}}>{h}</th>)}</tr></thead>
                      <tbody>{emps.flatMap(emp=>emp.software.map((sw,j)=>(
                        <tr key={emp.id+sw} style={{background:j%2===0?"#fff":"#f9fbfd"}}>
                          <td style={{padding:"8px 12px",borderBottom:"1px solid #eee"}}>{emp.name}</td>
                          <td style={{padding:"8px 12px",borderBottom:"1px solid #eee",color:"#1a73e8",fontWeight:600}}>{sw}</td>
                          <td style={{padding:"8px 12px",borderBottom:"1px solid #eee"}}><span style={{background:"#fff3e0",color:"#e65100",borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700}}>Pending</span></td>
                        </tr>
                      )))}</tbody>
                    </table>
                    <div style={{display:"flex",gap:10,marginBottom:16}}>
                      <div style={{background:"#1a73e8",color:"#fff",borderRadius:8,padding:"9px 18px",fontWeight:700,cursor:"pointer",fontSize:13}}>✅ Confirm Access</div>
                      <div style={{background:"#d32f2f",color:"#fff",borderRadius:8,padding:"9px 18px",fontWeight:700,cursor:"pointer",fontSize:13}}>🚫 Revoke Access</div>
                    </div>
                    <p style={{color:"#888",fontSize:12}}>Respond within <strong>7 days</strong>. Contact <a href="#" style={{color:"#1a73e8"}}>it-access@company.com</a>.</p>
                  </div>
                </div>
              );
            })()}
            {isAdmin&&<button onClick={()=>{setEmailSent(true);setTimeout(()=>setEmailSent(false),3000);}} style={{marginTop:20,background:emailSent?C.accent2:C.accent,color:"#fff",border:"none",borderRadius:10,padding:"11px 28px",fontWeight:800,fontSize:14,cursor:"pointer"}}>
              {emailSent?"✅ Emails Queued!":"📧 Send Quarterly Emails to All Managers"}
            </button>}
          </div>
        )}

        {/* ════ ARCHITECTURE (Admin) ════ */}
        {tab==="Architecture"&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>Implementation Architecture</div>
            <div style={{color:C.muted,fontSize:13,marginBottom:24}}>Technical blueprint for the full automation system.</div>
            {[
              {title:"1. Keka API — Employee Sync",color:C.accent,icon:"👥",items:["REST API /v1/hris/employees for employee+manager data","Daily sync via GitHub Actions cron","Store in PostgreSQL or Google Sheets"]},
              {title:"2. Software List Management",color:"#a78bfa",icon:"📋",items:["Master software list: Name, Vendor, License, Owner","Import from Excel sheet (drag & drop supported)"]},
              {title:"3. Access Mapping",color:C.accent3,icon:"🔗",items:["employee_id ↔ software_id mapping table","Flag inactive users (90+ days) for auto-review"]},
              {title:"4. Quarterly Emails",color:C.accent2,icon:"📧",items:["Cron: 0 9 1 1,4,7,10 * (Jan/Apr/Jul/Oct)","One email per manager via SendGrid / AWS SES"]},
              {title:"5. Response Handling",color:C.danger,icon:"✅",items:["Manager approves/revokes each tool per employee","Auto-remind after 5 days, escalate after 7"]},
              {title:"6. Tech Stack",color:C.muted,icon:"🛠️",items:["Backend: Python FastAPI / Node.js","DB: PostgreSQL / Google Sheets","Auth: Google OAuth / Azure AD SSO"]},
            ].map(s=>(
              <div key={s.title} style={{background:C.card,border:`1.5px solid ${C.border}`,borderLeft:`4px solid ${s.color}`,borderRadius:12,padding:"18px 22px",marginBottom:14}}>
                <div style={{fontWeight:800,fontSize:15,color:s.color,marginBottom:10}}>{s.icon} {s.title}</div>
                <ul style={{margin:0,padding:"0 0 0 18px"}}>{s.items.map((it,i)=><li key={i} style={{color:C.text,marginBottom:5,fontSize:13,lineHeight:1.6}}>{it}</li>)}</ul>
              </div>
            ))}
          </div>
        )}

        {/* ════ USER MANAGEMENT (Admin) ════ */}
        {tab==="User Management"&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>User Management</div>
            <div style={{color:C.muted,fontSize:13,marginBottom:20}}>All platform users and their login credentials (admin view only)</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:C.highlight}}>{["User","Username","Password","Role","Department"].map(h=><th key={h} style={{padding:"11px 14px",textAlign:"left",color:C.muted,fontWeight:700,borderBottom:`1.5px solid ${C.border}`}}>{h}</th>)}</tr></thead>
                <tbody>{USERS.map((u,i)=>(
                  <tr key={u.id} style={{background:i%2===0?C.card:C.bg}}>
                    <td style={{padding:"11px 14px"}}><div style={{display:"flex",alignItems:"center",gap:10}}><Avatar user={u} size={28}/><span style={{fontWeight:600}}>{u.name}</span></div></td>
                    <td style={{padding:"11px 14px",fontFamily:"monospace",color:C.accent}}>{u.username}</td>
                    <td style={{padding:"11px 14px",fontFamily:"monospace",color:C.muted}}>{u.password}</td>
                    <td style={{padding:"11px 14px"}}><RoleBadge role={u.role}/></td>
                    <td style={{padding:"11px 14px",color:C.text}}>{u.department}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        )}

        {/* ════ MY PROFILE (Employee) ════ */}
        {tab==="My Profile"&&isEmp&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:20}}>My Profile</div>
            <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:16,padding:28,maxWidth:500}}>
              <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:24}}>
                <Avatar user={user} size={56}/>
                <div>
                  <div style={{fontWeight:800,fontSize:18}}>{user.name}</div>
                  <RoleBadge role={user.role}/>
                  <div style={{color:C.muted,fontSize:13,marginTop:4}}>{user.department} Department</div>
                </div>
              </div>
              {myProfile&&[
                {label:"Employee ID",value:myProfile.id},
                {label:"Email",value:myProfile.email},
                {label:"Manager",value:myProfile.manager},
                {label:"Department",value:myProfile.department},
              ].map(f=>(
                <div key={f.label} style={{display:"flex",justifyContent:"space-between",padding:"11px 0",borderBottom:`1px solid ${C.border}`}}>
                  <span style={{color:C.muted,fontSize:13}}>{f.label}</span>
                  <span style={{fontWeight:600,fontSize:13}}>{f.value}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ════ MY SOFTWARE (Employee) ════ */}
        {tab==="My Software"&&isEmp&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:20}}>My Software Access</div>
            {myProfile?(
              <div style={{display:"flex",flexWrap:"wrap",gap:14}}>
                {myProfile.software.map(sw=>(
                  <div key={sw} style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:12,padding:"20px 24px",minWidth:160,textAlign:"center"}}>
                    <div style={{fontSize:32,marginBottom:8}}>💻</div>
                    <div style={{fontWeight:700,fontSize:15}}>{sw}</div>
                    <div style={{marginTop:8}}><Badge status="Approved"/></div>
                  </div>
                ))}
              </div>
            ):<div style={{color:C.muted}}>No software access found.</div>}
          </div>
        )}

        {/* ════ MY REVIEWS (Employee) ════ */}
        {tab==="My Reviews"&&isEmp&&(
          <div>
            <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>My Access Reviews</div>
            <div style={{color:C.muted,fontSize:13,marginBottom:20}}>View-only — contact your manager to change status.</div>
            {myReviews.length===0?(
              <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:12,padding:40,textAlign:"center",color:C.muted}}>
                <div style={{fontSize:40,marginBottom:12}}>📋</div>
                <div>No reviews found for your account.</div>
              </div>
            ):(
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr style={{background:C.highlight}}>{["Review ID","Software","Manager","Quarter","Status"].map(h=><th key={h} style={{padding:"11px 14px",textAlign:"left",color:C.muted,fontWeight:700,borderBottom:`1.5px solid ${C.border}`}}>{h}</th>)}</tr></thead>
                  <tbody>{myReviews.map((r,i)=>(
                    <tr key={r.id} style={{background:i%2===0?C.card:C.bg}}>
                      <td style={{padding:"11px 14px",color:C.muted,fontFamily:"monospace"}}>{r.id}</td>
                      <td style={{padding:"11px 14px"}}><span style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:5,padding:"1px 8px",fontSize:11,fontWeight:600}}>{r.software}</span></td>
                      <td style={{padding:"11px 14px",color:C.accent}}>{r.manager}</td>
                      <td style={{padding:"11px 14px",color:C.muted}}>{r.quarter}</td>
                      <td style={{padding:"11px 14px"}}><Badge status={r.status}/></td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

/* ════════════════════════════════
   ROOT APP
════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  if(!user)return <LoginPage onLogin={setUser}/>;
  return <Dashboard user={user} onLogout={()=>setUser(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
