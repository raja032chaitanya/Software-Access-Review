<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoftAccess – Quarterly Access Review Platform</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f1117;font-family:'Sora','Segoe UI',sans-serif}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0f1117}
    ::-webkit-scrollbar-thumb{background:#242938;border-radius:4px}
    button,input,select,textarea{font-family:inherit}
    input,select{background:#0f1117;color:#e8eaf0;border:1.5px solid #242938;border-radius:7px;padding:7px 12px;font-size:13px;width:100%;outline:none;transition:border .2s}
    input:focus,select:focus{border-color:#4f8ef7}
    .del-btn{background:#2d1010;color:#f87171;border:1px solid #f87171;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}
    .del-btn:hover{background:#f87171;color:#fff}
    .add-btn{background:#0d2d22;color:#34d399;border:1px solid #34d399;border-radius:7px;padding:7px 18px;cursor:pointer;font-size:13px;font-weight:700;margin-top:10px}
    .add-btn:hover{background:#34d399;color:#fff}
    .save-btn{background:#4f8ef7;color:#fff;border:none;border-radius:8px;padding:9px 24px;cursor:pointer;font-size:14px;font-weight:800}
    .save-btn:hover{background:#3a7ef0}
    .edit-section{background:#181c27;border:1.5px solid #242938;border-radius:12px;padding:20px 24px;margin-bottom:18px}
    .edit-section h3{color:#4f8ef7;font-size:15px;font-weight:800;margin-bottom:14px}
    .edit-row{display:grid;gap:8px;margin-bottom:10px;align-items:center}
    .edit-row.emp{grid-template-columns:80px 1fr 1fr 1fr 1fr 1fr auto}
    .edit-row.mgr{grid-template-columns:1fr 1fr 1fr auto}
    .edit-row.rev{grid-template-columns:70px 1fr 1fr 1fr 100px auto}
    .col-label{color:#7b82a0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .toast{position:fixed;bottom:28px;right:28px;background:#181c27;border:1.5px solid #34d399;color:#34d399;border-radius:10px;padding:12px 24px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideIn .3s ease}
    .toast.err{border-color:#f87171;color:#f87171}
    @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .qcard{background:#232940;border:1.5px solid #242938;border-radius:10px;padding:16px;cursor:pointer;transition:border .2s;text-align:left}
    .qcard:hover{border-color:#4f8ef7}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const C={bg:"#0f1117",card:"#181c27",border:"#242938",accent:"#4f8ef7",accent2:"#34d399",accent3:"#f59e42",danger:"#f87171",text:"#e8eaf0",muted:"#7b82a0",highlight:"#232940"};

const DEFAULT={
  employees:[
    {id:"E001",name:"Arjun Reddy",  email:"arjun@company.com", manager:"Priya Sharma",department:"Engineering",software:["Jira","GitHub","Slack","Figma"]},
    {id:"E002",name:"Sneha Kapoor", email:"sneha@company.com", manager:"Priya Sharma",department:"Engineering",software:["Jira","GitHub","Slack"]},
    {id:"E003",name:"Rahul Mehta",  email:"rahul@company.com", manager:"Vikram Nair", department:"HR",         software:["Keka","Slack","Zoom"]},
    {id:"E004",name:"Divya Singh",  email:"divya@company.com", manager:"Vikram Nair", department:"HR",         software:["Keka","Slack"]},
    {id:"E005",name:"Kiran Babu",   email:"kiran@company.com", manager:"Anjali Iyer", department:"Finance",    software:["SAP","Slack","Zoom","Tableau"]},
    {id:"E006",name:"Meera Nair",   email:"meera@company.com", manager:"Anjali Iyer", department:"Finance",    software:["SAP","Slack"]},
  ],
  managers:[
    {name:"Priya Sharma",email:"priya@company.com",department:"Engineering"},
    {name:"Vikram Nair", email:"vikram@company.com",department:"HR"},
    {name:"Anjali Iyer", email:"anjali@company.com",department:"Finance"},
  ],
  softwareList:["Jira","GitHub","Slack","Figma","Keka","Zoom","SAP","Tableau","Notion","Confluence"],
  reviews:[
    {id:"R001",employee:"Arjun Reddy", software:"Figma",  manager:"Priya Sharma",status:"Pending", quarter:"Q2 2026"},
    {id:"R002",employee:"Kiran Babu",  software:"Tableau",manager:"Anjali Iyer", status:"Approved",quarter:"Q2 2026"},
    {id:"R003",employee:"Sneha Kapoor",software:"GitHub", manager:"Priya Sharma",status:"Revoked", quarter:"Q2 2026"},
    {id:"R004",employee:"Divya Singh", software:"Keka",   manager:"Vikram Nair", status:"Pending", quarter:"Q2 2026"},
  ],
};

/* ── utils ── */
function dl(content,name,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();}
function toCSV(rows,cols){const e=v=>`"${String(v===undefined||v===null?"":v).replace(/"/g,'""')}"`;return[cols.join(","),...rows.map(r=>cols.map(c=>e(Array.isArray(r[c])?r[c].join("|"):r[c])).join(","))].join("\n");}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=[];let cur="",inQ=false;
    for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===","&&!inQ){vals.push(cur);cur="";}else cur+=ch;}
    vals.push(cur);
    const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||"").replace(/^"|"$/g,"").trim());
    return obj;
  });
}

/* ── Import/Export Modal ── */
function IOModal({data,onImport,onClose}){
  const [tab,setTab]=useState("export");
  const [importText,setImportText]=useState("");
  const [importType,setImportType]=useState("employees");
  const [importFmt,setImportFmt]=useState("csv");
  const [exportTarget,setExportTarget]=useState("employees");
  const [exportFmt,setExportFmt]=useState("csv");
  const fileRef=useRef();

  const COLS={employees:["id","name","email","manager","department","software"],managers:["name","email","department"],reviews:["id","employee","software","manager","status","quarter"],softwareList:["name"]};
  const SAMPLES={
    employees:"id,name,email,manager,department,software\nE001,John Doe,john@co.com,Manager Name,Engineering,Jira|Slack|Zoom",
    managers:"name,email,department\nJohn Manager,john@co.com,Engineering",
    reviews:"id,employee,software,manager,status,quarter\nR001,John Doe,Slack,John Manager,Pending,Q2 2026",
    softwareList:"name\nJira\nSlack\nZoom\nFigma",
  };

  function doExport(){
    if(exportFmt==="full"){dl(JSON.stringify(data,null,2),"softaccess_full_backup.json","application/json");return;}
    const rows=exportTarget==="softwareList"?data.softwareList.map(s=>({name:s})):data[exportTarget];
    if(exportFmt==="csv")dl(toCSV(rows,COLS[exportTarget]),`${exportTarget}.csv`,"text/csv");
    else dl(JSON.stringify(rows,null,2),`${exportTarget}.json`,"application/json");
  }

  function doImport(){
    try{
      let parsed;
      const text=importText.trim();
      if(importFmt==="json"){
        parsed=JSON.parse(text);
        if(parsed.employees&&parsed.managers&&parsed.reviews){onImport(parsed);return;}
      }else{parsed=parseCSV(text);}
      const next={...data};
      if(importType==="softwareList")next.softwareList=parsed.map(r=>r.name).filter(Boolean);
      else if(importType==="employees")next.employees=parsed.map(r=>({...r,software:r.software?r.software.split("|").map(s=>s.trim()):[]}));
      else next[importType]=parsed;
      onImport(next);
    }catch(e){alert("❌ Error: "+e.message);}
  }

  function handleFile(e){
    const f=e.target.files[0];if(!f)return;
    setImportFmt(f.name.endsWith(".json")?"json":"csv");
    const r=new FileReader();r.onload=ev=>setImportText(ev.target.result);r.readAsText(f);
  }

  const tb=(t,lbl)=><button onClick={()=>setTab(t)} style={{background:tab===t?C.accent:C.highlight,color:tab===t?"#fff":C.muted,border:`1px solid ${tab===t?C.accent:C.border}`,borderRadius:8,padding:"8px 22px",cursor:"pointer",fontWeight:700,fontSize:14}}>{lbl}</button>;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:16,width:"95%",maxWidth:720,maxHeight:"92vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,.7)"}}>
        <div style={{background:C.bg,borderBottom:`1.5px solid ${C.border}`,padding:"18px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:18,color:C.text}}>📂 Import / Export Data</div>
          <button onClick={onClose} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13}}>✕ Close</button>
        </div>
        <div style={{display:"flex",gap:10,padding:"14px 28px",borderBottom:`1px solid ${C.border}`,background:C.card}}>
          {tb("export","📤 Export")}
          {tb("import","📥 Import")}
        </div>
        <div style={{overflowY:"auto",padding:"24px 28px",flex:1}}>

          {tab==="export"&&(
            <div>
              <p style={{color:C.muted,fontSize:14,marginBottom:20}}>Download your dashboard data as CSV (Excel/Sheets) or JSON (backup/restore).</p>
              {/* Quick export cards */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:24}}>
                {[
                  {label:"👥 Employees CSV",   desc:"All employee & software data",   color:C.accent,  fn:()=>dl(toCSV(data.employees,COLS.employees),"employees.csv","text/csv")},
                  {label:"🧑‍💼 Managers CSV",  desc:"All manager details",             color:"#a78bfa", fn:()=>dl(toCSV(data.managers,COLS.managers),"managers.csv","text/csv")},
                  {label:"📋 Reviews CSV",     desc:"All review records & statuses",  color:C.accent3, fn:()=>dl(toCSV(data.reviews,COLS.reviews),"reviews.csv","text/csv")},
                  {label:"📦 Software CSV",    desc:"Full software tool list",         color:C.accent2, fn:()=>dl(toCSV(data.softwareList.map(s=>({name:s})),["name"]),"softwareList.csv","text/csv")},
                  {label:"🗂 Full Backup JSON",desc:"Export everything as JSON",       color:C.danger,  fn:()=>dl(JSON.stringify(data,null,2),"softaccess_backup.json","application/json")},
                  {label:"📊 Reviews JSON",   desc:"Reviews in JSON format",           color:C.muted,   fn:()=>dl(JSON.stringify(data.reviews,null,2),"reviews.json","application/json")},
                ].map((q,i)=>(
                  <button key={i} className="qcard" onClick={q.fn} style={{border:`1.5px solid ${q.color}`}}>
                    <div style={{fontWeight:700,color:q.color,fontSize:14}}>{q.label}</div>
                    <div style={{color:C.muted,fontSize:12,marginTop:4}}>{q.desc}</div>
                    <div style={{color:C.muted,fontSize:11,marginTop:6}}>⬇️ Click to download</div>
                  </button>
                ))}
              </div>
              <div style={{borderTop:`1px solid ${C.border}`,paddingTop:20}}>
                <div style={{color:C.muted,fontSize:12,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>Custom Export</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                  <div>
                    <div style={{color:C.muted,fontSize:12,marginBottom:6}}>What to export</div>
                    <select value={exportTarget} onChange={e=>setExportTarget(e.target.value)}>
                      <option value="employees">👥 Employees</option>
                      <option value="managers">🧑‍💼 Managers</option>
                      <option value="reviews">📋 Reviews</option>
                      <option value="softwareList">📦 Software List</option>
                    </select>
                  </div>
                  <div>
                    <div style={{color:C.muted,fontSize:12,marginBottom:6}}>Format</div>
                    <select value={exportFmt} onChange={e=>setExportFmt(e.target.value)}>
                      <option value="csv">📊 CSV (Excel/Sheets)</option>
                      <option value="json">{ }{} JSON</option>
                      <option value="full">🗂 Full Backup JSON</option>
                    </select>
                  </div>
                </div>
                <button className="save-btn" style={{width:"100%",padding:"12px"}} onClick={doExport}>⬇️ Download {exportTarget} as {exportFmt.toUpperCase()}</button>
              </div>
            </div>
          )}

          {tab==="import"&&(
            <div>
              <p style={{color:C.muted,fontSize:14,marginBottom:20}}>Upload a CSV or JSON file to load data into the dashboard. Use the sample format below as a guide.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                <div>
                  <div style={{color:C.muted,fontSize:12,marginBottom:6}}>Import into</div>
                  <select value={importType} onChange={e=>setImportType(e.target.value)}>
                    <option value="employees">👥 Employees</option>
                    <option value="managers">🧑‍💼 Managers</option>
                    <option value="reviews">📋 Reviews</option>
                    <option value="softwareList">📦 Software List</option>
                  </select>
                </div>
                <div>
                  <div style={{color:C.muted,fontSize:12,marginBottom:6}}>File format</div>
                  <select value={importFmt} onChange={e=>setImportFmt(e.target.value)}>
                    <option value="csv">📊 CSV</option>
                    <option value="json">{ }{} JSON</option>
                  </select>
                </div>
              </div>
              {/* Upload zone */}
              <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${C.accent}`,borderRadius:12,padding:"22px",textAlign:"center",cursor:"pointer",background:C.highlight,marginBottom:16,transition:"background .2s"}}>
                <div style={{fontSize:36,marginBottom:8}}>📁</div>
                <div style={{fontWeight:700,color:C.text,fontSize:15}}>Click to choose file</div>
                <div style={{color:C.muted,fontSize:13,marginTop:4}}>Supports .csv and .json</div>
                <input ref={fileRef} type="file" accept=".csv,.json" onChange={handleFile} style={{display:"none"}}/>
              </div>
              <div style={{color:C.muted,fontSize:12,fontWeight:700,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>Or paste data directly</div>
              <textarea value={importText} onChange={e=>setImportText(e.target.value)}
                placeholder={`Paste ${importFmt.toUpperCase()} here...\n\nExpected format:\n${SAMPLES[importType]||""}`}
                style={{width:"100%",minHeight:130,background:C.bg,color:C.text,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"12px",fontSize:13,fontFamily:"'DM Mono',monospace",resize:"vertical",outline:"none"}}
              />
              {/* Sample hint */}
              <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 16px",marginTop:10,marginBottom:18}}>
                <div style={{color:C.accent,fontSize:12,fontWeight:700,marginBottom:6}}>📌 Expected {importFmt.toUpperCase()} format for "{importType}":</div>
                <pre style={{color:C.muted,fontSize:12,fontFamily:"'DM Mono',monospace",whiteSpace:"pre-wrap",overflowX:"auto"}}>{importFmt==="csv"?SAMPLES[importType]:JSON.stringify(
                  importType==="employees"?[{id:"E001",name:"John",email:"j@co.com",manager:"Manager Name",department:"Engineering",software:["Jira","Slack"]}]:
                  importType==="managers"?[{name:"Manager Name",email:"m@co.com",department:"Engineering"}]:
                  importType==="reviews"?[{id:"R001",employee:"John",software:"Slack",manager:"Manager Name",status:"Pending",quarter:"Q2 2026"}]:
                  ["Jira","Slack","Zoom"]
                ,null,2)}</pre>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <button className="save-btn" style={{padding:"12px"}} onClick={doImport} disabled={!importText.trim()}>📥 Import & Apply Data</button>
                <button onClick={()=>{setImportText("");if(fileRef.current)fileRef.current.value="";}} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"12px",cursor:"pointer",fontWeight:700,fontSize:14}}>🗑 Clear</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Edit Modal ── */
function EditModal({data,onSave,onClose}){
  const [d,setD]=useState(JSON.parse(JSON.stringify(data)));
  const ue=(i,f,v)=>setD(p=>{const e=[...p.employees];e[i]={...e[i],[f]:v};return{...p,employees:e}});
  const uesw=(i,v)=>setD(p=>{const e=[...p.employees];e[i]={...e[i],software:v.split(",").map(s=>s.trim()).filter(Boolean)};return{...p,employees:e}});
  const de=i=>setD(p=>({...p,employees:p.employees.filter((_,j)=>j!==i)}));
  const ae=()=>setD(p=>({...p,employees:[...p.employees,{id:"E"+(p.employees.length+1).toString().padStart(3,"0"),name:"",email:"",manager:p.managers[0]?.name||"",department:"",software:[]}]}));
  const um=(i,f,v)=>setD(p=>{const m=[...p.managers];m[i]={...m[i],[f]:v};return{...p,managers:m}});
  const dm=i=>setD(p=>({...p,managers:p.managers.filter((_,j)=>j!==i)}));
  const am=()=>setD(p=>({...p,managers:[...p.managers,{name:"",email:"",department:""}]}));
  const us=(i,v)=>setD(p=>{const s=[...p.softwareList];s[i]=v;return{...p,softwareList:s}});
  const ds=i=>setD(p=>({...p,softwareList:p.softwareList.filter((_,j)=>j!==i)}));
  const as=()=>setD(p=>({...p,softwareList:[...p.softwareList,""]}));
  const ur=(i,f,v)=>setD(p=>{const r=[...p.reviews];r[i]={...r[i],[f]:v};return{...p,reviews:r}});
  const dr=i=>setD(p=>({...p,reviews:p.reviews.filter((_,j)=>j!==i)}));
  const ar=()=>setD(p=>({...p,reviews:[...p.reviews,{id:"R"+(p.reviews.length+1).toString().padStart(3,"0"),employee:"",software:"",manager:p.managers[0]?.name||"",status:"Pending",quarter:"Q2 2026"}]}));
  const inp=(val,fn,ph="")=><input value={val} onChange={e=>fn(e.target.value)} placeholder={ph}/>;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:16,width:"95%",maxWidth:1000,maxHeight:"92vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,.7)"}}>
        <div style={{background:C.card,borderBottom:`1.5px solid ${C.border}`,padding:"18px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:18,color:C.text}}>✏️ Edit Dashboard Data</div>
          <div style={{display:"flex",gap:10}}>
            <button className="save-btn" onClick={()=>onSave(d)}>💾 Save Changes</button>
            <button onClick={onClose} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"9px 16px",cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
        <div style={{overflowY:"auto",padding:"24px 28px",flex:1}}>
          <div className="edit-section">
            <h3>👥 Employees</h3>
            <div className="edit-row emp" style={{marginBottom:6}}>{["ID","Name","Email","Manager","Dept","Software (comma separated)",""].map((l,i)=><div key={i} className="col-label">{l}</div>)}</div>
            {d.employees.map((e,i)=>(
              <div key={i} className="edit-row emp">
                {inp(e.id,v=>ue(i,"id",v),"E001")}{inp(e.name,v=>ue(i,"name",v),"Full Name")}{inp(e.email,v=>ue(i,"email",v),"email@co.com")}
                <select value={e.manager} onChange={ev=>ue(i,"manager",ev.target.value)}>{d.managers.map(m=><option key={m.name}>{m.name}</option>)}</select>
                {inp(e.department,v=>ue(i,"department",v),"Dept")}{inp(e.software.join(", "),v=>uesw(i,v),"Jira, Slack...")}
                <button className="del-btn" onClick={()=>de(i)}>✕</button>
              </div>
            ))}
            <button className="add-btn" onClick={ae}>+ Add Employee</button>
          </div>
          <div className="edit-section">
            <h3>🧑‍💼 Managers</h3>
            <div className="edit-row mgr" style={{marginBottom:6}}>{["Name","Email","Department",""].map((l,i)=><div key={i} className="col-label">{l}</div>)}</div>
            {d.managers.map((m,i)=>(
              <div key={i} className="edit-row mgr">
                {inp(m.name,v=>um(i,"name",v))}{inp(m.email,v=>um(i,"email",v))}{inp(m.department,v=>um(i,"department",v))}
                <button className="del-btn" onClick={()=>dm(i)}>✕</button>
              </div>
            ))}
            <button className="add-btn" onClick={am}>+ Add Manager</button>
          </div>
          <div className="edit-section">
            <h3>📦 Software List</h3>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {d.softwareList.map((sw,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:C.highlight,border:`1px solid ${C.border}`,borderRadius:8,padding:"4px 4px 4px 10px"}}>
                  <input value={sw} onChange={e=>us(i,e.target.value)} style={{width:100,background:"transparent",border:"none",color:C.text,fontWeight:700,fontSize:13}}/>
                  <button className="del-btn" style={{margin:0}} onClick={()=>ds(i)}>✕</button>
                </div>
              ))}
              <button className="add-btn" style={{margin:0}} onClick={as}>+ Add</button>
            </div>
          </div>
          <div className="edit-section">
            <h3>📋 Review Records</h3>
            <div className="edit-row rev" style={{marginBottom:6}}>{["ID","Employee","Software","Manager","Status",""].map((l,i)=><div key={i} className="col-label">{l}</div>)}</div>
            {d.reviews.map((r,i)=>(
              <div key={i} className="edit-row rev">
                {inp(r.id,v=>ur(i,"id",v))}{inp(r.employee,v=>ur(i,"employee",v))}{inp(r.software,v=>ur(i,"software",v))}
                <select value={r.manager} onChange={e=>ur(i,"manager",e.target.value)}>{d.managers.map(m=><option key={m.name}>{m.name}</option>)}</select>
                <select value={r.status} onChange={e=>ur(i,"status",e.target.value)}>{["Pending","Approved","Revoked"].map(s=><option key={s}>{s}</option>)}</select>
                <button className="del-btn" onClick={()=>dr(i)}>✕</button>
              </div>
            ))}
            <button className="add-btn" onClick={ar}>+ Add Review</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Badge & StatCard ── */
const sBg={Pending:"#2d2210",Approved:"#0d2d22",Revoked:"#2d1010"};
const sC={Pending:C.accent3,Approved:C.accent2,Revoked:C.danger};
function Badge({status}){return <span style={{background:sBg[status]||C.highlight,color:sC[status]||C.muted,borderRadius:6,padding:"2px 12px",fontSize:12,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{status}</span>}
function StatCard({label,value,sub,color}){return <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"22px 28px",flex:1,minWidth:140}}><div style={{fontSize:32,fontWeight:800,color:color||C.accent,fontFamily:"'DM Mono',monospace"}}>{value}</div><div style={{fontSize:14,color:C.text,fontWeight:600,marginTop:4}}>{label}</div>{sub&&<div style={{fontSize:12,color:C.muted,marginTop:2}}>{sub}</div>}</div>}

/* ── App ── */
const NAV=["Overview","Employees","Reviews","Email Preview","Architecture"];
function App(){
  const [tab,setTab]=useState("Overview");
  const [data,setData]=useState(DEFAULT);
  const [editOpen,setEditOpen]=useState(false);
  const [ioOpen,setIoOpen]=useState(false);
  const [emailSent,setEmailSent]=useState(false);
  const [selMgr,setSelMgr]=useState(DEFAULT.managers[0].name);
  const [reviews,setReviews]=useState(DEFAULT.reviews);
  const [toast,setToast]=useState(null);

  function showToast(msg,err=false){setToast({msg,err});setTimeout(()=>setToast(null),3200);}
  function handleSave(nd){setData(nd);setReviews(nd.reviews);setSelMgr(nd.managers[0]?.name||"");setEditOpen(false);showToast("✅ Changes saved successfully!");}
  function handleImport(nd){setData(nd);setReviews(nd.reviews);setSelMgr(nd.managers[0]?.name||"");setIoOpen(false);showToast("✅ Data imported successfully!");}

  const pending=reviews.filter(r=>r.status==="Pending").length;
  const approved=reviews.filter(r=>r.status==="Approved").length;
  const revoked=reviews.filter(r=>r.status==="Revoked").length;
  const mgrEmps=data.employees.filter(e=>e.manager===selMgr);
  const changeStatus=(id,s)=>setReviews(p=>p.map(r=>r.id===id?{...r,status:s}:r));
  const nb=t=>({background:tab===t?C.accent:"transparent",color:tab===t?"#fff":C.muted,border:"none",borderRadius:"8px 8px 0 0",padding:"9px 22px",cursor:"pointer",fontWeight:700,fontSize:14,transition:"all .2s"});

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text}}>
      {toast&&<div className={`toast${toast.err?" err":""}`}>{toast.msg}</div>}
      {editOpen&&<EditModal data={data} onSave={handleSave} onClose={()=>setEditOpen(false)}/>}
      {ioOpen&&<IOModal data={data} onImport={handleImport} onClose={()=>setIoOpen(false)}/>}

      {/* Header */}
      <div style={{background:C.card,borderBottom:`1.5px solid ${C.border}`,padding:"18px 36px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:36,height:36,borderRadius:10,background:`linear-gradient(135deg,${C.accent},#7c3aed)`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:18,color:"#fff"}}>S</div>
          <div>
            <div style={{fontWeight:800,fontSize:18,letterSpacing:-0.5}}>SoftAccess</div>
            <div style={{fontSize:11,color:C.muted,letterSpacing:1}}>QUARTERLY ACCESS REVIEW PLATFORM</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setIoOpen(true)} style={{background:C.highlight,border:`1.5px solid ${C.accent2}`,color:C.accent2,borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:14}}>📂 Import / Export</button>
          <button onClick={()=>setEditOpen(true)} style={{background:C.highlight,border:`1.5px solid ${C.accent}`,color:C.accent,borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:14}}>✏️ Edit Data</button>
          <div style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 16px",fontSize:13,color:C.accent3,fontWeight:600}}>Q2 2026 · Review Active</div>
        </div>
      </div>

      {/* Nav */}
      <div style={{display:"flex",gap:4,padding:"12px 36px 0",borderBottom:`1.5px solid ${C.border}`,background:C.card}}>
        {NAV.map(n=><button key={n} onClick={()=>setTab(n)} style={nb(n)}>{n}</button>)}
      </div>

      <div style={{padding:"32px 36px"}}>

        {/* OVERVIEW */}
        {tab==="Overview"&&(
          <div>
            <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Dashboard Overview</div>
            <div style={{color:C.muted,fontSize:14,marginBottom:28}}>Q2 2026 · {new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</div>
            <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:32}}>
              <StatCard label="Total Employees" value={data.employees.length} sub="Across all departments" color={C.accent}/>
              <StatCard label="Software Tools" value={data.softwareList.length} sub="Under review" color="#a78bfa"/>
              <StatCard label="Pending Reviews" value={pending} sub="Awaiting action" color={C.accent3}/>
              <StatCard label="Approved" value={approved} sub="Access confirmed" color={C.accent2}/>
              <StatCard label="Revoked" value={revoked} sub="Access removed" color={C.danger}/>
            </div>
            <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:28,marginBottom:28}}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:20}}>⚙️ Automation Pipeline</div>
              <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:8}}>
                {[{icon:"👥",label:"Keka Portal",sub:"Employee sync"},{icon:"→"},{icon:"📋",label:"Software List",sub:"From prospect site"},{icon:"→"},{icon:"🔗",label:"Access Mapping",sub:"User ↔ Software"},{icon:"→"},{icon:"📧",label:"Email Managers",sub:"Quarterly trigger"},{icon:"→"},{icon:"✅",label:"Reviews Sheet",sub:"Auto-updated"}].map((s,i)=>
                  s.icon==="→"?<div key={i} style={{color:C.muted,fontSize:22}}>→</div>:
                  <div key={i} style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 18px",textAlign:"center",minWidth:110}}>
                    <div style={{fontSize:24}}>{s.icon}</div><div style={{fontSize:13,fontWeight:700,marginTop:4}}>{s.label}</div><div style={{fontSize:11,color:C.muted}}>{s.sub}</div>
                  </div>
                )}
              </div>
            </div>
            <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:28}}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>📦 Software Coverage</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                {data.softwareList.map(sw=>{const n=data.employees.filter(e=>e.software.includes(sw)).length;return(
                  <div key={sw} style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 16px",display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontWeight:700,fontSize:14}}>{sw}</span>
                    <span style={{background:C.accent,color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:700}}>{n} users</span>
                  </div>
                );})}
              </div>
            </div>
          </div>
        )}

        {/* EMPLOYEES */}
        {tab==="Employees"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:22,fontWeight:800}}>Employee Access Matrix</div>
              <button onClick={()=>{dl(toCSV(data.employees,["id","name","email","manager","department","software"]),"employees.csv","text/csv");showToast("✅ Employees CSV downloaded!");}} style={{background:C.highlight,border:`1px solid ${C.accent2}`,color:C.accent2,borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>⬇️ Export CSV</button>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                <thead><tr style={{background:C.highlight}}>{["ID","Employee","Department","Manager","Software Access","Count"].map(h=><th key={h} style={{padding:"12px 16px",textAlign:"left",color:C.muted,fontWeight:700,borderBottom:`1.5px solid ${C.border}`}}>{h}</th>)}</tr></thead>
                <tbody>{data.employees.map((e,i)=>(
                  <tr key={e.id} style={{background:i%2===0?C.card:C.bg}}>
                    <td style={{padding:"12px 16px",color:C.muted,fontFamily:"monospace"}}>{e.id}</td>
                    <td style={{padding:"12px 16px",fontWeight:600}}><div>{e.name}</div><div style={{fontSize:12,color:C.muted}}>{e.email}</div></td>
                    <td style={{padding:"12px 16px"}}>{e.department}</td>
                    <td style={{padding:"12px 16px",color:C.accent}}>{e.manager}</td>
                    <td style={{padding:"12px 16px"}}><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{e.software.map(s=><span key={s} style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 10px",fontSize:12,fontWeight:600}}>{s}</span>)}</div></td>
                    <td style={{padding:"12px 16px",fontWeight:800,color:C.accent2}}>{e.software.length}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        )}

        {/* REVIEWS */}
        {tab==="Reviews"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:22,fontWeight:800}}>Access Review Records</div>
              <button onClick={()=>{dl(toCSV(reviews,["id","employee","software","manager","status","quarter"]),"reviews.csv","text/csv");showToast("✅ Reviews CSV downloaded!");}} style={{background:C.highlight,border:`1px solid ${C.accent2}`,color:C.accent2,borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>⬇️ Export CSV</button>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                <thead><tr style={{background:C.highlight}}>{["Review ID","Employee","Software","Manager","Quarter","Status","Action"].map(h=><th key={h} style={{padding:"12px 16px",textAlign:"left",color:C.muted,fontWeight:700,borderBottom:`1.5px solid ${C.border}`}}>{h}</th>)}</tr></thead>
                <tbody>{reviews.map((r,i)=>(
                  <tr key={r.id} style={{background:i%2===0?C.card:C.bg}}>
                    <td style={{padding:"12px 16px",color:C.muted,fontFamily:"monospace"}}>{r.id}</td>
                    <td style={{padding:"12px 16px",fontWeight:600}}>{r.employee}</td>
                    <td style={{padding:"12px 16px"}}><span style={{background:C.highlight,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 10px",fontSize:12,fontWeight:600}}>{r.software}</span></td>
                    <td style={{padding:"12px 16px",color:C.accent}}>{r.manager}</td>
                    <td style={{padding:"12px 16px",color:C.muted}}>{r.quarter}</td>
                    <td style={{padding:"12px 16px"}}><Badge status={r.status}/></td>
                    <td style={{padding:"12px 16px"}}>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>changeStatus(r.id,"Approved")} style={{background:r.status==="Approved"?C.accent2:"transparent",color:r.status==="Approved"?"#fff":C.accent2,border:`1px solid ${C.accent2}`,borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>✓</button>
                        <button onClick={()=>changeStatus(r.id,"Revoked")} style={{background:r.status==="Revoked"?C.danger:"transparent",color:r.status==="Revoked"?"#fff":C.danger,border:`1px solid ${C.danger}`,borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>✗</button>
                      </div>
                    </td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        )}

        {/* EMAIL PREVIEW */}
        {tab==="Email Preview"&&(
          <div>
            <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Quarterly Email Preview</div>
            <div style={{color:C.muted,fontSize:14,marginBottom:24}}>Preview the email sent to each manager every quarter.</div>
            <div style={{display:"flex",gap:12,marginBottom:24,flexWrap:"wrap"}}>
              {data.managers.map(m=><button key={m.name} onClick={()=>setSelMgr(m.name)} style={{background:selMgr===m.name?C.accent:C.highlight,color:selMgr===m.name?"#fff":C.text,border:`1px solid ${selMgr===m.name?C.accent:C.border}`,borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:600,fontSize:14}}>{m.name}</button>)}
            </div>
            <div style={{background:"#fff",borderRadius:14,overflow:"hidden",maxWidth:680,boxShadow:"0 8px 40px rgba(0,0,0,.4)"}}>
              <div style={{background:"#1a73e8",padding:"16px 24px",color:"#fff"}}>
                <div style={{fontWeight:800,fontSize:18}}>🔐 Quarterly Software Access Review – Action Required</div>
                <div style={{fontSize:13,marginTop:4,opacity:.85}}>Q2 2026 · {new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</div>
              </div>
              <div style={{padding:"28px 32px",color:"#222",fontFamily:"sans-serif",fontSize:15,lineHeight:1.7}}>
                <p>Dear <strong>{selMgr}</strong>,</p>
                <p style={{marginTop:12}}>Please review the software access for your direct reports listed below.</p>
                <p style={{fontWeight:700,margin:"16px 0 8px"}}>Your Team's Software Access:</p>
                <table style={{width:"100%",borderCollapse:"collapse",marginBottom:20,fontSize:14}}>
                  <thead><tr style={{background:"#f3f6fb"}}>{["Employee","Software","Still Required?"].map(h=><th key={h} style={{padding:"10px 14px",textAlign:"left",color:"#555",fontWeight:700,borderBottom:"2px solid #e0e7ef"}}>{h}</th>)}</tr></thead>
                  <tbody>{mgrEmps.flatMap(emp=>emp.software.map((sw,j)=>(
                    <tr key={emp.id+sw} style={{background:j%2===0?"#fff":"#f9fbfd"}}>
                      <td style={{padding:"9px 14px",borderBottom:"1px solid #eee"}}>{emp.name}</td>
                      <td style={{padding:"9px 14px",borderBottom:"1px solid #eee",color:"#1a73e8",fontWeight:600}}>{sw}</td>
                      <td style={{padding:"9px 14px",borderBottom:"1px solid #eee"}}><span style={{background:"#fff3e0",color:"#e65100",borderRadius:6,padding:"2px 12px",fontSize:12,fontWeight:700}}>Pending</span></td>
                    </tr>
                  )))}</tbody>
                </table>
                <div style={{display:"flex",gap:12,marginBottom:20}}>
                  <div style={{background:"#1a73e8",color:"#fff",borderRadius:8,padding:"10px 22px",fontWeight:700,cursor:"pointer"}}>✅ Confirm Access</div>
                  <div style={{background:"#d32f2f",color:"#fff",borderRadius:8,padding:"10px 22px",fontWeight:700,cursor:"pointer"}}>🚫 Revoke Access</div>
                </div>
                <p style={{color:"#888",fontSize:13}}>Respond within <strong>7 days</strong>. Contact <a href="#" style={{color:"#1a73e8"}}>it-access@company.com</a>.</p>
              </div>
            </div>
            <button onClick={()=>{setEmailSent(true);setTimeout(()=>setEmailSent(false),3000);}} style={{marginTop:24,background:emailSent?C.accent2:C.accent,color:"#fff",border:"none",borderRadius:10,padding:"12px 32px",fontWeight:800,fontSize:15,cursor:"pointer"}}>
              {emailSent?"✅ Emails Queued!":"📧 Trigger Quarterly Emails to All Managers"}
            </button>
          </div>
        )}

        {/* ARCHITECTURE */}
        {tab==="Architecture"&&(
          <div>
            <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Implementation Architecture</div>
            <div style={{color:C.muted,fontSize:14,marginBottom:28}}>Full technical blueprint for the automation system.</div>
            {[
              {title:"1. Keka API Integration — Employee Sync",color:C.accent,icon:"👥",items:["Use Keka REST API (/v1/hris/employees) to pull employee list","Schedule daily sync via cron or GitHub Actions","Fields: ID, Name, Email, Manager, Department","Store in PostgreSQL or Google Sheets"]},
              {title:"2. Software List Management",color:"#a78bfa",icon:"📋",items:["Maintain master software list in database","Each entry: Name, Vendor, License Type, Owner","Import from existing Excel sheet"]},
              {title:"3. Access Mapping",color:C.accent3,icon:"🔗",items:["Match employees to software from AD/Okta","Table: employee_id, software_id, granted_date, status","Flag users inactive 90+ days for review"]},
              {title:"4. Quarterly Email Automation",color:C.accent2,icon:"📧",items:["Trigger on 1st of every quarter (Jan, Apr, Jul, Oct)","One email per manager with team's access list","SendGrid / AWS SES / SMTP delivery"]},
              {title:"5. Manager Response Handling",color:C.danger,icon:"✅",items:["Confirm or Revoke per user-software row","Reminders after 5 days, escalate after 7","Export final report as CSV/Excel"]},
              {title:"6. Recommended Tech Stack",color:C.muted,icon:"🛠️",items:["Backend: Python FastAPI or Node.js","DB: PostgreSQL or Google Sheets","Email: SendGrid, SES, or Microsoft Graph","Auth: Google OAuth / Azure AD SSO"]},
            ].map(s=>(
              <div key={s.title} style={{background:C.card,border:`1.5px solid ${C.border}`,borderLeft:`4px solid ${s.color}`,borderRadius:12,padding:"20px 24px",marginBottom:16}}>
                <div style={{fontWeight:800,fontSize:16,color:s.color,marginBottom:12}}>{s.icon} {s.title}</div>
                <ul style={{margin:0,padding:"0 0 0 20px"}}>{s.items.map((it,i)=><li key={i} style={{color:C.text,marginBottom:6,fontSize:14,lineHeight:1.6}}>{it}</li>)}</ul>
              </div>
            ))}
            <div style={{background:C.highlight,border:`1.5px solid ${C.accent}`,borderRadius:12,padding:"20px 24px"}}>
              <div style={{fontWeight:800,fontSize:15,color:C.accent,marginBottom:10}}>📅 Quarterly Schedule</div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                {["Q1 – January 1","Q2 – April 1","Q3 – July 1","Q4 – October 1"].map(q=><div key={q} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 18px",fontSize:14,fontWeight:700,color:C.accent}}>{q}</div>)}
              </div>
              <div style={{marginTop:12,fontSize:13,color:C.muted}}>Cron: <code style={{background:C.bg,padding:"2px 8px",borderRadius:4,color:C.accent2}}>0 9 1 1,4,7,10 *</code></div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
